<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Oráculo 3D - Jogo de Adivinhação</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="scene" id="scene">

    <div class="stars"></div>
    <div class="grid-floor"></div>

    <div class="cube cube-one">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="cube cube-two">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <section class="game-card" id="gameCard">

      <div class="card-glow"></div>

      <div class="badge">
        <span class="status-dot"></span>
        SISTEMA ONLINE
      </div>

      <h1>
        ORÁCULO <span>3D</span>
      </h1>

      <p class="subtitle">
        Descubra o número secreto entre
        <strong>1 e 100</strong>.
      </p>

      <div class="orb-container">
        <div class="orb">
          <div class="orb-core">?</div>
        </div>
      </div>

      <p class="message" id="message">
        O número secreto foi gerado. Faça seu primeiro palpite.
      </p>

      <div class="input-area">
        <label for="guessInput">
          DIGITE SEU PALPITE
        </label>

        <div class="input-row">
          <input
            type="number"
            id="guessInput"
            min="1"
            max="100"
            placeholder="Ex: 42"
            autocomplete="off"
          >

          <button id="guessButton">
            CHUTAR
          </button>
        </div>
      </div>

      <div class="attempts-box">

        <div class="attempts-header">
          <span class="info-label">
            TENTATIVAS RESTANTES
          </span>

          <strong id="attempts">10</strong>
        </div>

        <div class="progress">
          <div
            class="progress-bar"
            id="progressBar">
          </div>
        </div>

      </div>

      <button
        class="reset-button"
        id="resetButton">
        NOVA PARTIDA
      </button>

      <div class="history">
        <span>
          HISTÓRICO DE PALPITES
        </span>

        <div
          id="historyList"
          class="history-list">
          Nenhum palpite registrado
        </div>
      </div>

    </section>

    <footer>
      JAVASCRIPT • DOM • LÓGICA • INTERATIVIDADE 3D
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
